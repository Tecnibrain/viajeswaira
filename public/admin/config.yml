# ============================================================
#  PANEL DE ADMINISTRACIÓN — https://viajeswaira.com/admin
#  Cada vez que guardas algo aquí, el sitio se actualiza solo
#  en 1–2 minutos. Guía: COMO_SUBIR_PAQUETES.md
# ============================================================
backend:
  name: github
  repo: Tecnibrain/viajeswaira
  branch: ccr-e5c74af5-vsp1td
  commit_messages:
    create: 'Panel: crea {{collection}} «{{slug}}»'
    update: 'Panel: actualiza {{collection}} «{{slug}}»'
    delete: 'Panel: elimina {{collection}} «{{slug}}»'
    uploadMedia: 'Panel: sube imagen {{path}}'
    deleteMedia: 'Panel: elimina imagen {{path}}'

site_url: https://viajeswaira.com
display_url: https://viajeswaira.com
logo_url: /img/brand/emblema.webp

# Fotos: se guardan en public/img/uploads y se optimizan automáticamente
media_folder: public/img/uploads
public_folder: /img/uploads
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600

# Direcciones web limpias: "Cartagena Mágica" -> cartagena-magica
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  # ----------------------------------------------------------
  - name: paquetes
    label: Paquetes
    label_singular: Paquete
    description: Planes turísticos que aparecen en /paquetes. Para crear uno nuevo pulsa «Nuevo Paquete».
    icon: luggage
    folder: content/paquetes
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: title
    slug: '{{title}}'
    summary: '{{title}} · {{duration}}'
    sortable_fields: [order, title, price]
    fields:
      - label: Nombre del paquete
        name: title
        widget: string
        hint: 'Ej: Cartagena Colonial y Caribe'
      - label: Destino
        name: destinationId
        widget: relation
        collection: destinos
        value_field: '{{slug}}'
        search_fields: [name, country]
        display_fields: ['{{name}} ({{country}})']
        hint: Si el destino no existe, créalo primero en la sección «Destinos».
      - label: Duración
        name: duration
        widget: string
        hint: 'Ej: 4 días / 3 noches'
      - label: Precio por persona (COP)
        name: price
        widget: number
        value_type: int
        min: 0
        hint: 'Solo números, sin puntos ni signo $. Ej: 1450000'
      - label: Categoría
        name: category
        widget: select
        options: [Playa, Playa y cultura, Naturaleza, Aventura, Ciudad, Luna de miel, Familiar, Internacional, Europa, Cruceros]
        default: Playa
      - label: Descripción corta
        name: description
        widget: text
        hint: 2 o 3 líneas que aparecen en la tarjeta del paquete.
      - label: Foto principal
        name: image
        widget: image
        required: false
        hint: Opcional. Si la dejas vacía se usa la foto del destino. Recomendado horizontal.
      - label: Galería de fotos
        name: gallery
        widget: list
        required: false
        label_singular: foto
        field: { label: Foto, name: foto, widget: image }
        hint: Opcional. Si la dejas vacía se usan las fotos del destino.
      - label: Qué incluye
        name: includes
        widget: list
        label_singular: ítem
        field: { label: Ítem, name: item, widget: string }
        hint: 'Un elemento por línea. Ej: Tiquetes aéreos ida y regreso'
      - label: Qué NO incluye
        name: excludes
        widget: list
        required: false
        label_singular: ítem
        field: { label: Ítem, name: item, widget: string }
      - label: Itinerario (día a día)
        name: itinerary
        widget: list
        label_singular: día
        summary: '{{fields.title}}'
        hint: Agrega un elemento por cada día, en orden. El número de día se pone solo.
        fields:
          - { label: Título del día, name: title, widget: string, hint: 'Ej: Llegada a Cartagena' }
          - { label: Actividades del día, name: text, widget: text }
      - label: Destacar en la página de inicio
        name: featured
        widget: boolean
        default: false
        hint: En el inicio se muestran los 3 primeros paquetes destacados.
      - label: Publicado (visible en el sitio)
        name: published
        widget: boolean
        default: true
        hint: Apágalo para ocultar el paquete sin borrarlo.
      - label: Es información de ejemplo (DEMO)
        name: demo
        widget: boolean
        default: false
        hint: Si está encendido, el precio se muestra con la etiqueta DEMO. Apágalo cuando la información sea real.
      - label: Orden
        name: order
        widget: number
        value_type: int
        required: false
        default: 50
        hint: Los números más bajos aparecen primero.

  # ----------------------------------------------------------
  - name: destinos
    label: Destinos
    label_singular: Destino
    description: Destinos que aparecen en /destinos. Cada paquete pertenece a un destino.
    icon: travel_explore
    folder: content/destinos
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: name
    slug: '{{name}}'
    summary: '{{name}} ({{country}})'
    sortable_fields: [order, name]
    fields:
      - { label: Nombre del destino, name: name, widget: string, hint: 'Ej: Cartagena' }
      - { label: Ciudad, name: city, widget: string, hint: 'Ej: Cartagena de Indias' }
      - { label: País, name: country, widget: string, hint: 'Ej: Colombia' }
      - label: Tipo
        name: region
        widget: select
        options:
          - { label: Nacional, value: nacional }
          - { label: Internacional, value: internacional }
        default: nacional
      - label: Descripción
        name: description
        widget: text
      - label: Foto principal
        name: image
        widget: image
        hint: Recomendado horizontal (más ancha que alta).
      - label: Galería de fotos
        name: gallery
        widget: list
        required: false
        label_singular: foto
        field: { label: Foto, name: foto, widget: image }
      - label: Imperdibles (lugares o actividades)
        name: highlights
        widget: list
        required: false
        label_singular: imperdible
        field: { label: Imperdible, name: item, widget: string }
      - label: Precio desde, por persona (COP)
        name: priceFrom
        widget: number
        value_type: int
        min: 0
        hint: 'Solo números. Ej: 1200000'
      - { label: Duración sugerida, name: duration, widget: string, hint: 'Ej: 4 días / 3 noches' }
      - { label: Publicado (visible en el sitio), name: published, widget: boolean, default: true }
      - { label: Es información de ejemplo (DEMO), name: demo, widget: boolean, default: false }
      - { label: Orden, name: order, widget: number, value_type: int, required: false, default: 50, hint: Los números más bajos aparecen primero. }
